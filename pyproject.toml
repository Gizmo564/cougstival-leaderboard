[project]
name = "cougstival-leaderboard"
version = "1.0.0"
description = "Per-day leaderboards for Goosechase events, published to GitHub Pages or your local network"
requires-python = ">=3.9"
dependencies = ["playwright>=1.40", "tzdata"]
license = { text = "GPL-3.0-or-later" }

[project.scripts]
cougstival-lb = "cougstival_lb.cli:main"

[tool.setuptools.packages.find]
include = ["cougstival_lb*"]

[tool.setuptools.package-data]
cougstival_lb = ["web/*.html"]
